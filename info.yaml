project:
  title: "EchoScope"
  author: "qd39l"
  discord: ""
  description: "A reversible butterfly-effect microscope: twin worlds, VGA and sound"
  language: "Verilog"
  clock_hz: 25000000
  tiles: "1x1"
  top_module: "tt_um_qd39l_echoscope"
  source_files:
    - "project.v"
    - "echo_engine.v"
pinout:
  ui[0]: "Reverse time"
  ui[1]: "Pause"
  ui[2]: "Single step (rising edge)"
  ui[3]: "Flip one cell in world B (rising edge)"
  ui[4]: "Clone A into B (rising edge)"
  ui[5]: "Show differences / diagnostic scan"
  ui[6]: "Mute audio"
  ui[7]: "Diagnostic mode (sampled during reset)"
  uo[0]: "VGA R1 / A past scan"
  uo[1]: "VGA G1 / A present scan"
  uo[2]: "VGA B1 / B past scan"
  uo[3]: "VGA VSYNC / B present scan"
  uo[4]: "VGA R0 / diagnostic zero"
  uo[5]: "VGA G0 / diagnostic zero"
  uo[6]: "VGA B0 / diagnostic zero"
  uo[7]: "VGA HSYNC / diagnostic zero"
  uio[0]: "Perturbation cell index 0"
  uio[1]: "Perturbation cell index 1"
  uio[2]: "Perturbation cell index 2"
  uio[3]: "Perturbation cell index 3"
  uio[4]: "Cell index 4"
  uio[5]: "Busy / state readback invalid"
  uio[6]: "Worlds exactly equal (both state planes)"
  uio[7]: "Audio (TT Audio Pmod)"
yaml_version: 6
